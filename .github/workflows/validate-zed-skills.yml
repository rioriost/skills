name: Validate standalone Zed skills

on:
  push:
    paths:
      - 'zed/**'
      - 'scripts/validate_zed_skills.py'
      - 'LICENSE'
      - '.github/workflows/validate-zed-skills.yml'
  pull_request:
    paths:
      - 'zed/**'
      - 'scripts/validate_zed_skills.py'
      - 'LICENSE'
      - '.github/workflows/validate-zed-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_zed_skills.py
